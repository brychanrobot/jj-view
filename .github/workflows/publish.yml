name: Publish

on:
    release:
        types: [published]
    workflow_dispatch:

jobs:
    publish:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Install pnpm
              uses: pnpm/setup@v2
              with:
                  version: 11
                  cache: true
                  install: false

            - name: Install Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 22

            - name: Setup jj (Jujutsu)
              uses: ./.github/actions/setup-jj

            - name: Install Dependencies
              run: pnpm install --frozen-lockfile

            - name: Publish to OpenVSX and VS Code Marketplace
              run: pnpm release
              env:
                  OVSX_PAT: ${{ secrets.OVSX_PAT }}
                  VSCE_PAT: ${{ secrets.VSCE_PAT }}
