name: License

on:
    push:
        branches: ['main']
    pull_request:
        # Workaround: GitHub's native stacked PR preview has an asynchronous race condition
        # where PRs in a stack can evaluate workflow triggers before the stack object is registered,
        # causing intermediate PRs targeting non-main parent branches to miss CI if restricted to 'main'.
        # Track these upstream GitHub issues to know when this workaround can be removed:
        # - https://github.com/github/gh-stack/issues/425 (Mid-stack PRs miss stack-aware triggers)
        # - https://github.com/github/gh-stack/issues/466 (Concurrent pushes and duplicate/cancelled CI runs)
        # Running on all target branches ensures intermediate PRs in a stack always run CI checks.
        branches: ['*']

concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        env:
            PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN: 'false'

        steps:
            - uses: actions/checkout@v7

            - name: Install pnpm
              uses: pnpm/setup@v2
              with:
                  version: 11
                  install: false

            - name: Cache Go build & modules
              uses: actions/cache@v6
              with:
                  path: |
                      ~/.cache/go-build
                      ~/go/pkg/mod
                  key: go-license-${{ runner.os }}-v1.1.1
                  restore-keys: |
                      go-license-${{ runner.os }}-

            - name: Check License
              run: pnpm check-license
